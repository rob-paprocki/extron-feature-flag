name: Release

# Runs in the PUBLIC repository when a version tag arrives (or by hand for a
# tag): creates the GitHub release with the changelog notes and the prebuilt DLLs.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release for, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'rob-paprocki/extron-feature-flag'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Tag must be exactly vX.Y.Z
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag name"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Release files and notes
        run: |
          VERSION="${TAG#v}"
          mkdir dist-release
          for d in GCP GUIDesigner Toolbelt; do
            cp "dist/$d/Extron.Features.Factory.dll" "dist-release/Extron.Features.Factory-$d.dll"
          done
          (cd dist-release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          python3 scripts/release/changelog.py notes "$VERSION" > notes.md
      - name: Create GitHub release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"; exit 0
          fi
          gh release create "$TAG" dist-release/* --title "extron-feature-flag ${TAG#v}" --notes-file notes.md --verify-tag
